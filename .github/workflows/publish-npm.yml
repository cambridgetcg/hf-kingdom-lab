name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag pointing at current main
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-npm-hf-kingdom-lab
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare exact verified artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require main dispatch and a release-shaped tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Set up exact Node and npm pack runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Prove annotated tag, version, and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
      - name: Install exact dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit the production dependency graph
        run: bun audit --production
      - name: Test and build release surfaces
        run: |
          bun run check
          bun run build
          bun run site:build
      - name: Verify and retain the one release tarball
        run: |
          install -d -m 0700 "$RUNNER_TEMP/release"
          bun scripts/verify-package.ts --release-dir "$RUNNER_TEMP/release"
      - name: Transfer the exact verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish exact artifact with OIDC
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/@agenttool/hf-kingdom-lab
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download only the prepared release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: ${{ runner.temp }}/release
      - name: Set up the pinned trusted-publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Revalidate, publish, and compare registry bytes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(node --version)" = v24.18.1
          test "$(npm --version)" = 11.16.0

          release_dir="$RUNNER_TEMP/release"
          test -f "$release_dir/receipt.json"
          test ! -L "$release_dir/receipt.json"
          mapfile -t tarballs < <(find "$release_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          test "$(find "$release_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 2
          tarball="${tarballs[0]}"
          test ! -L "$tarball"

          expected_package="@agenttool/hf-kingdom-lab@${RELEASE_TAG#v}"
          export EXPECTED_PACKAGE="$expected_package"
          export TARBALL="$tarball"
          expected_sha="$(node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (receipt.protocol !== "hf-kingdom-package-verification/v1") throw new Error("bad receipt protocol");
            if (receipt.package !== process.env.EXPECTED_PACKAGE) throw new Error("bad receipt package");
            if (receipt.filename !== path.basename(process.env.TARBALL)) throw new Error("bad receipt filename");
            if (!Number.isInteger(receipt.bytes) || receipt.bytes < 1 || receipt.bytes > 2097152) throw new Error("bad receipt size");
            if (!/^[0-9a-f]{64}$/.test(receipt.sha256)) throw new Error("bad receipt hash");
            if (receipt.installed_with_lifecycle_scripts !== false || receipt.semantic_runtime_installed !== false) throw new Error("bad receipt effects");
            process.stdout.write(receipt.sha256);
          ' "$release_dir/receipt.json" )"
          expected_bytes="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).bytes' "$release_dir/receipt.json")"
          actual_sha="$(shasum -a 256 "$tarball" | cut -d ' ' -f 1)"
          actual_bytes="$(stat -c %s "$tarball")"
          test "$actual_sha" = "$expected_sha"
          test "$actual_bytes" = "$expected_bytes"

          npm publish "$tarball" --ignore-scripts --access public --provenance

          version="${RELEASE_TAG#v}"
          url=""
          for _ in $(seq 1 90); do
            url="$(npm view "@agenttool/hf-kingdom-lab@$version" dist.tarball --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s);if(typeof v==="string")process.stdout.write(v)}catch{}})' || true)"
            test -n "$url" && break
            sleep 5
          done
          if test -z "$url"; then
            echo "npm accepted the publish, but the immutable registry tarball was not observable within 450 seconds; inspect the registry before any retry" >&2
            exit 1
          fi
          case "$url" in
            https://registry.npmjs.org/@agenttool/hf-kingdom-lab/-/hf-kingdom-lab-*.tgz) ;;
            *) echo "npm returned an unexpected registry tarball URL after accepting publish" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --proto '=https' "$url" --output "$RUNNER_TEMP/registry.tgz"
          registry_sha="$(shasum -a 256 "$RUNNER_TEMP/registry.tgz" | cut -d ' ' -f 1)"
          test "$registry_sha" = "$expected_sha"
